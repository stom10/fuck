            // ৪র্থ বা তার পরের চ্যাপ্টার খুলতে শুধু নিচের মতো আরেকটি ব্লক কপি করে এখানে বসিয়ে দেবেন:
            {
                name: "alyx star",
                links: [

                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdXydq1BA9CtSrIPBj-K7OSM1ro0L-EgK7OsVV7pP89Q&s=10",

                ]
            },
            
        ];

const gallery = document.getElementById('gallery');
        const gallerySksk = document.getElementById('gallery-sksk');
        const secondChapterTitle = document.getElementById('second-chapter-title');
        const overlay = document.getElementById('fullscreen-overlay');
        const sliderTrack = document.getElementById('fs-slider-track');
        const fsPrevImg = document.getElementById('fs-prev-img');
        const fsImg = document.getElementById('fullscreen-img');
        const fsNextImg = document.getElementById('fs-next-img');
        const scrollTop = document.getElementById('scroll-top');
        const autoPlayBtn = document.getElementById('autoplay-btn');

        let currentIdx = 0;
        let images = [];
        let isAutoPlaying = false;
        let autoPlayInterval;
        let scale = 1;
        let startX = 0;
        let currentDragX = 0;
        let isDragging = false;
        let isAnimatingSlide = false;

        // ১. রাইট-ক্লিক, টেক্সট সিলেক্ট, কপি, কাট ও ড্র্যাগ সম্পূর্ণ বন্ধ করা
        ['contextmenu', 'copy', 'cut', 'selectstart', 'dragstart'].forEach(evt => {
            document.addEventListener(evt, e => e.preventDefault());
        });
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && ['c', 'a', 'x', 'u', 's'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });

        // ২. ফুলস্ক্রিনে ছবির রেজোলিউশন যতটা সম্ভব HD করার ফাংশন
        function getHdImageUrl(url) {
            if (!url) return '';
            return url
                .replace(/_320x_\.jpg$/i, '_1280x_.jpg')
                .replace(/\/460\//g, '/1280/');
        }

        // ৩. স্ক্রল ও লোডিংয়ের সময় ছবিগুলো সুন্দর অ্যানিমেশনের সাথে ভেসে ওঠার সিস্টেম
        const cardObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const delay = (Number(card.dataset.animIndex || 0) % 10) * 55;
                    setTimeout(() => {
                        card.classList.add('card-visible');
                    }, delay);
                    cardObserver.unobserve(card);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px 60px 0px' });

        function createPhotoCard(imgUrl, globalIndex, localIndex, labelPrefix) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.dataset.animIndex = localIndex;
            card.innerHTML = `<img src="${imgUrl}" alt="${labelPrefix} ${localIndex + 1}" loading="lazy" decoding="async">`;
            card.onclick = () => openFullscreen(globalIndex);
            cardObserver.observe(card);
            return card;
        }

        // ৪. আপনার দেওয়া নতুন সিরিয়াল অনুযায়ী সব চ্যাপ্টার সাজানো:
        // ১ম: সানি লিওন | ২য়: alyx star | ৩য়: মিয়াঁ খলিফা | ৪র্থ (শেষ): সেরা কিছু
        function initGallery() {
            images = [];
            gallery.innerHTML = '';
            gallerySksk.innerHTML = '';

            // ১ম চ্যাপ্টার: সানি লিওন
            imageLinks.forEach((imgUrl, index) => {
                const globalIndex = images.length;
                images.push(imgUrl);
                gallery.appendChild(createPhotoCard(imgUrl, globalIndex, index, 'Photo'));
            });

            // চ্যাপ্টারগুলো খুঁজে বের করা
            const alyxChapter = moreChapters.find(ch => ch.name.trim().toLowerCase() === 'alyx star');
            const seraKichuChapter = moreChapters.find(ch => ch.name.trim() === 'সেরা কিছু');
            const otherCustomChapters = moreChapters.filter(
                ch => ch !== alyxChapter && ch !== seraKichuChapter
            );

            // ২য় চ্যাপ্টার: alyx star (আগের ৪র্থ চ্যাপ্টারটি এখানে ২য় স্থানে বসবে)
            const secondChapterData = alyxChapter || { name: 'alyx star', links: [] };
            if (secondChapterTitle) {
                secondChapterTitle.textContent = secondChapterData.name;
            }
            secondChapterData.links.forEach((imgUrl, index) => {
                const globalIndex = images.length;
                images.push(imgUrl);
                gallerySksk.appendChild(createPhotoCard(imgUrl, globalIndex, index, secondChapterData.name));
            });

            // পরবর্তী চ্যাপ্টারগুলোর কন্টেইনার
            let extraContainer = document.getElementById('extra-chapters-container');
            if (!extraContainer) {
                extraContainer = document.createElement('div');
                extraContainer.id = 'extra-chapters-container';
                gallerySksk.insertAdjacentElement('afterend', extraContainer);
            }
            extraContainer.innerHTML = '';

            // ৩য় চ্যাপ্টার: মিয়াঁ খলিফা + অন্য কোনো নতুন চ্যাপ্টার থাকলে সেগুলো + সবার শেষে 'সেরা কিছু'
            const orderedRemainingChapters = [
                { name: 'মিয়াঁ খলিফা', links: skskImageLinks },
                ...otherCustomChapters
            ];
            if (seraKichuChapter) {
                orderedRemainingChapters.push(seraKichuChapter);
            }

            orderedRemainingChapters.forEach((chapter) => {
                const titleDiv = document.createElement('div');
                titleDiv.className = 'w-full max-w-6xl mx-auto px-6 pt-8 pb-2 text-left';
                titleDiv.innerHTML = `<h2 class="text-white text-2xl font-light opacity-80">${chapter.name}</h2>`;
                extraContainer.appendChild(titleDiv);

                const sec = document.createElement('section');
                sec.className = 'gallery-grid';

                chapter.links.forEach((imgUrl, idx) => {
                    const globalIndex = images.length;
                    images.push(imgUrl);
                    sec.appendChild(createPhotoCard(imgUrl, globalIndex, idx, chapter.name));
                });

                extraContainer.appendChild(sec);
            });
        }

        // ৫. ফুলস্ক্রিন স্লাইডার এবং HD ইমেজ লোডার
        function setImgWithFallback(imgEl, rawUrl) {
            const hdUrl = getHdImageUrl(rawUrl);
            imgEl.onerror = () => {
                imgEl.onerror = null;
                imgEl.src = rawUrl;
            };
            imgEl.src = hdUrl;
        }

        function syncSliderImages() {
            if (!images.length) return;
            const prevIndex = (currentIdx - 1 + images.length) % images.length;
            const nextIndex = (currentIdx + 1) % images.length;

            sliderTrack.style.transition = 'none';
            sliderTrack.style.transform = 'translate3d(-100vw, 0, 0)';

            scale = 1;
            fsImg.style.transform = 'scale(1)';

            setImgWithFallback(fsPrevImg, images[prevIndex]);
            setImgWithFallback(fsImg, images[currentIdx]);
            setImgWithFallback(fsNextImg, images[nextIndex]);
        }

        function openFullscreen(index) {
            currentIdx = index;
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            syncSliderImages();
        }

        function closeFullscreen() {
            overlay.style.display = 'none';
            stopAutoPlay();
            document.body.style.overflow = 'auto';
        }

        fsImg.addEventListener('dblclick', closeFullscreen);

        // পাশের ছবিতে স্লাইড করে যাওয়ার ফাংশন (মোবাইল সোয়াইপ, অটো প্লে ও ল্যাপটপের অ্যারো বাটনের জন্য)
        function slideToDirection(direction) {
            if (isAnimatingSlide || !images.length) return;
            isAnimatingSlide = true;

            sliderTrack.style.transition = 'transform 0.32s cubic-bezier(0.22, 1, 0.36, 1)';
            if (direction === 'next') {
                sliderTrack.style.transform = 'translate3d(-200vw, 0, 0)';
            } else {
                sliderTrack.style.transform = 'translate3d(0vw, 0, 0)';
            }

            setTimeout(() => {
                if (direction === 'next') {
                    currentIdx = (currentIdx + 1) % images.length;
                } else {
                    currentIdx = (currentIdx - 1 + images.length) % images.length;
                }
                syncSliderImages();
                isAnimatingSlide = false;
            }, 320);
        }

        function nextImg() {
            slideToDirection('next');
        }

        function prevImg() {
            slideToDirection('prev');
        }

        // ৬. ফোনে আঙুল দিয়ে টানলে গ্যালারির মতো ছবিটি সরে যাওয়া ও পরের ছবিটি আসা
        overlay.addEventListener('touchstart', e => {
            if (isAnimatingSlide || e.touches.length > 1) return;
            startX = e.touches[0].clientX;
            currentDragX = 0;
            isDragging = true;
            sliderTrack.style.transition = 'none';
        }, { passive: true });

        overlay.addEventListener('touchmove', e => {
            if (!isDragging || scale > 1) return;
            currentDragX = e.touches[0].clientX - startX;
            sliderTrack.style.transform = `translate3d(calc(-100vw + ${currentDragX}px), 0, 0)`;
        }, { passive: true });

        overlay.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;

            if (scale > 1) return;

            const swipeThreshold = window.innerWidth * 0.16;
            if (currentDragX < -swipeThreshold) {
                slideToDirection('next');
            } else if (currentDragX > swipeThreshold) {
                slideToDirection('prev');
            } else {
                sliderTrack.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)';
                sliderTrack.style.transform = 'translate3d(-100vw, 0, 0)';
            }
            currentDragX = 0;
        });

        // ৭. ল্যাপটপের কিবোর্ডের ডান (ArrowRight) ও বাম (ArrowLeft) বাটনে চাপ দিয়ে ছবি পরিবর্তন
        window.addEventListener('keydown', e => {
            if (overlay.style.display === 'flex') {
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextImg();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevImg();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeFullscreen();
                }
            }
        });

        // মাউস হুইল জুম
        overlay.addEventListener('wheel', e => {
            e.preventDefault();
            scale += e.deltaY * -0.001;
            scale = Math.min(Math.max(0.5, scale), 4);
            fsImg.style.transform = `scale(${scale})`;
        }, { passive: false });

        function toggleAutoPlay() {
            if (isAutoPlaying) stopAutoPlay();
            else startAutoPlay();
        }

        function startAutoPlay() {
            isAutoPlaying = true;
            autoPlayBtn.innerText = "Auto Play: ON";
            autoPlayInterval = setInterval(nextImg, 3000);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            autoPlayBtn.innerText = "Auto Play: OFF";
            clearInterval(autoPlayInterval);
        }

        autoPlayBtn.onclick = (e) => {
            e.stopPropagation();
            toggleAutoPlay();
        };

        overlay.onclick = (e) => {
            if (e.target === overlay || e.target.classList.contains('fs-slide') || e.target === fsImg) {
                if (isAutoPlaying) stopAutoPlay();
            }
        };

        // বাটার-স্মুথ স্ক্রল শ্রোতা (passive listener)
        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                scrollTop.style.display = "flex";
            } else {
                scrollTop.style.display = "none";
            }
        }, { passive: true });

        // গ্যালারি চালু করা
        initGallery();
    </script>
