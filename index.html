                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyIdmhc1RCMzjp-jsgWqdxLIy1QCn475tpIvAS5YLDNg&s",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIf55MzTzkwRAyTCwe7NjSDnqtm_vERv7nVwDMZg7UMQ&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHcxNYQPx5a-VWft13zqzPs7ZvFZMjy70kU9AJL0KkbQ&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQitBNDnZXamQvEmGc-JKcAwjgW8q7FB9lujwd5MwNqCQ&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRs8AH-2NE5MoUwcdLZvLEd7HxwRzykhubnS_YOV13HrA&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcVCiiPLzqiGe68zj1kBjBZH2wgemRU_ZFsg12xoYe7w&s=10",
                    
                   
                    // এখানে কমা দিয়ে SKSK চ্যাপ্টারের সব ছবির লিঙ্ক বসান
                ]
            },
            // ৪র্থ বা তার পরের চ্যাপ্টার খুলতে শুধু নিচের মতো আরেকটি ব্লক কপি করে এখানে বসিয়ে দেবেন:
            {
                name: "alyx star",
                links: [
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPR-Ktx0rkpqSjRL4TDhKcjN5gvXgi_q-VUnjaf0zyrw&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdXydq1BA9CtSrIPBj-K7OSM1ro0L-EgK7OsVV7pP89Q&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEPhbsd_5XCOQ0gNZbXJdpQxATDTkhu0bQvzjZyhpOAA&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkPOTiryWbagHiNCr8zAf2cfyGZxvAAfZnACJcSZsGsg&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOc650IIijp7Iqk28tKQydj2MsxtcezXTSzbVC1pycIA&s=10",
                ]
            },
            
        ];

        const gallery = document.getElementById('gallery');
        const gallerySksk = document.getElementById('gallery-sksk');
        const overlay = document.getElementById('fullscreen-overlay');
        const fsImg = document.getElementById('fullscreen-img');
        const scrollTop = document.getElementById('scroll-top');
        const autoPlayBtn = document.getElementById('autoplay-btn');

        let currentIdx = 0;
        let images = [];
        let isAutoPlaying = false;
        let autoPlayInterval;
        let scale = 1;
        let startX = 0;

        // আগের ২টা চ্যাপ্টার + নতুন সব চ্যাপ্টারের ছবির কার্ড জেনারেট করা
        function initGallery() {
            images = [...imageLinks, ...skskImageLinks];
            gallery.innerHTML = '';
            gallerySksk.innerHTML = '';

            // ১ম চ্যাপ্টারের ছবি সাজানো (আগের মতোই থাকবে)
            imageLinks.forEach((imgUrl, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card fade-in';
                card.innerHTML = `<img src="${imgUrl}" alt="Photo ${index + 1}" loading="lazy">`;
                card.onclick = () => openFullscreen(index);
                gallery.appendChild(card);
            });

            // ২য় চ্যাপ্টারের ছবি সাজানো (আগের মতোই থাকবে)
            skskImageLinks.forEach((imgUrl, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card fade-in';
                const globalIndex = imageLinks.length + index;
                card.innerHTML = `<img src="${imgUrl}" alt="Photo ${index + 1}" loading="lazy">`;
                card.onclick = () => openFullscreen(globalIndex);
                gallerySksk.appendChild(card);
            });

            // ৩য় চ্যাপ্টার ও তার পরের নতুন চ্যাপ্টারগুলো ২য় চ্যাপ্টারের ঠিক নিচে সাজানো
            let extraContainer = document.getElementById('extra-chapters-container');
            if (!extraContainer) {
                extraContainer = document.createElement('div');
                extraContainer.id = 'extra-chapters-container';
                gallerySksk.insertAdjacentElement('afterend', extraContainer);
            }
            extraContainer.innerHTML = '';

            moreChapters.forEach((chapter) => {
                // চ্যাপ্টারের নাম
                const titleDiv = document.createElement('div');
                titleDiv.className = 'w-full max-w-6xl mx-auto px-6 pt-8 pb-2 text-left';
                titleDiv.innerHTML = `<h2 class="text-white text-2xl font-light opacity-80">${chapter.name}</h2>`;
                extraContainer.appendChild(titleDiv);

                // চ্যাপ্টারের ছবির গ্রিড
                const sec = document.createElement('section');
                sec.className = 'gallery-grid';

                chapter.links.forEach((imgUrl, idx) => {
                    const globalIndex = images.length;
                    images.push(imgUrl);

                    const card = document.createElement('div');
                    card.className = 'photo-card fade-in';
                    card.innerHTML = `<img src="${imgUrl}" alt="${chapter.name} ${idx + 1}" loading="lazy">`;
                    card.onclick = () => openFullscreen(globalIndex);
                    sec.appendChild(card);
                });

                extraContainer.appendChild(sec);
            });
        }
        function openFullscreen(index) {
            currentIdx = index;
            fsImg.src = images[currentIdx];
            overlay.style.display = 'flex';
            scale = 1;
            fsImg.style.transform = `scale(${scale})`;
            document.body.style.overflow = 'hidden';
        }

        function closeFullscreen() {
            overlay.style.display = 'none';
            stopAutoPlay();
            document.body.style.overflow = 'auto';
        }

        fsImg.addEventListener('dblclick', closeFullscreen);

        function nextImg() {
            currentIdx = (currentIdx + 1) % images.length;
            updateFsImage();
        }

        function prevImg() {
            currentIdx = (currentIdx - 1 + images.length) % images.length;
            updateFsImage();
        }

        function updateFsImage() {
            fsImg.style.opacity = 0;
            setTimeout(() => {
                fsImg.src = images[currentIdx];
                fsImg.style.opacity = 1;
            }, 200);
        }

        overlay.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
        overlay.addEventListener('touchend', e => {
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextImg();
                else prevImg();
            }
        });

        overlay.addEventListener('wheel', e => {
            e.preventDefault();
            scale += e.deltaY * -0.001;
            scale = Math.min(Math.max(.5, scale), 4);
            fsImg.style.transform = `scale(${scale})`;
        });

        function toggleAutoPlay() {
            if (isAutoPlaying) stopAutoPlay();
            else startAutoPlay();
        }

        function startAutoPlay() {
            isAutoPlaying = true;
            autoPlayBtn.innerText = "Auto Play: ON";
            autoPlayInterval = setInterval(nextImg, 3000);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            autoPlayBtn.innerText = "Auto Play: OFF";
            clearInterval(autoPlayInterval);
        }

        autoPlayBtn.onclick = (e) => {
            e.stopPropagation();
            toggleAutoPlay();
        };

        overlay.onclick = (e) => {
            if (e.target === overlay || e.target === fsImg) {
                if (isAutoPlaying) stopAutoPlay();
            }
        };

        window.onscroll = () => {
            if (document.body.scrollTop > 500 || document.documentElement.scrollTop > 500) {
                scrollTop.style.display = "flex";
            } else {
                scrollTop.style.display = "none";
            }
        };

        // গ্যালারি চালু করা
        initGallery();

    </script>
</body>
</html>
