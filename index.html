                triggerVibration([60, 40, 90]);

                setTimeout(() => {
                    unlockWebsite();
                }, 420);
            } else {
                state.fails += 1;
                pinInputField.value = '';
                pinInputWrap.classList.remove('pin-error', 'pin-error-hard', 'pin-success');
                pinSubmitBtn.classList.remove('pin-btn-error', 'pin-btn-success');
                void pinInputWrap.offsetWidth;

                if (state.fails >= 5) {
                    state.lockCount += 1;
                    state.fails = 0;
                    const lockSec = getLockDurationSeconds(state.lockCount);
                    state.lockUntil = Date.now() + lockSec * 1000;
                    saveGuardState(state);

                    pinInputWrap.classList.add('pin-error-hard');
                    pinSubmitBtn.classList.add('pin-btn-error');
                    triggerVibration([240, 80, 240, 80, 350]);
                    updateLockoutUI();

                    setTimeout(() => {
                        pinInputWrap.classList.remove('pin-error-hard');
                        pinSubmitBtn.classList.remove('pin-btn-error');
                    }, 700);
                } else {
                    saveGuardState(state);
                    pinInputWrap.classList.add('pin-error');
                    pinSubmitBtn.classList.add('pin-btn-error');
                    triggerVibration([120, 50, 120]);
                    pinLockoutMsg.textContent = `ভুল পিন! (${state.fails}/5)`;

                    setTimeout(() => {
                        pinInputWrap.classList.remove('pin-error');
                        pinSubmitBtn.classList.remove('pin-btn-error');
                    }, 520);
                }
            }
        }

        pinSubmitBtn.addEventListener('click', verifyPinEntry);

        function unlockWebsite() {
            isAppUnlocked = true;
            appProtectedContent.style.display = 'block';
            quickLockBtn.style.display = 'flex';
            pinLockScreen.classList.add('unlocked-hide');
            document.body.style.overflow = 'auto';

            if (!hasGalleryInitialized) {
                hasGalleryInitialized = true;
                initGallery();
            }

            setTimeout(() => {
                pinInputWrap.classList.remove('pin-success');
                pinSubmitBtn.classList.remove('pin-btn-success');
                pinInputField.value = '';
            }, 450);
        }

        function lockWebsiteNow() {
            if (!isAppUnlocked) return;
            isAppUnlocked = false;
            closeSettingsDrawer();
            closePinChangeModal();
            if (overlay.style.display === 'block') {
                closeFullscreen();
            }
            appProtectedContent.style.display = 'none';
            quickLockBtn.style.display = 'none';
            pinInputField.value = '';
            pinLockoutMsg.textContent = '';
            pinInputWrap.classList.remove('pin-error', 'pin-error-hard', 'pin-success');
            pinSubmitBtn.classList.remove('pin-btn-error', 'pin-btn-success');
            pinLockScreen.classList.remove('unlocked-hide');
            document.body.style.overflow = 'hidden';
            updateLockoutUI();
            setTimeout(() => pinInputField.focus(), 120);
        }

        quickLockBtn.addEventListener('click', lockWebsiteNow);

        // ১. রাইট-ক্লিক, টেক্সট সিলেক্ট, কপি, কাট, ড্র্যাগ, Ctrl+U/F12 সম্পূর্ণ বন্ধ + Ctrl+8 লক শর্টকাট
        ['contextmenu', 'copy', 'cut', 'selectstart', 'dragstart'].forEach(evt => {
            document.addEventListener(evt, e => e.preventDefault());
        });
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === '8' || e.code === 'Digit8' || e.code === 'Numpad8')) {
                e.preventDefault();
                lockWebsiteNow();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && ['c', 'a', 'x', 'u', 's', 'v'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
            }
        });

        updateLockoutUI();
        // ২. পাশের ছবিগুলো যেন ০ সেকেন্ডে সাথে সাথে চলে আসে তার জন্য মেমোরি প্রিলোডার
        function preloadSingleImage(url) {
            if (!url || preloadedCache.has(url)) return;
            preloadedCache.add(url);
            const img = new Image();
            img.decoding = 'async';
            img.src = url;
        }

        function preloadNeighborImages() {
            if (!images.length) return;
            const total = images.length;
            // সামনের ও পেছনের ৩টি করে ছবি আগে থেকেই রেডি করে রাখা
            for (let offset = -3; offset <= 3; offset++) {
                const idx = (currentIdx + offset + total) % total;
                preloadSingleImage(images[idx]);
            }
        }

        // ৩. স্ক্রল ও লোডিংয়ের সময় ছবিগুলো ল্যাগ ছাড়াই সুন্দর অ্যানিমেশনের সাথে ভেসে ওঠা
        const cardObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    requestAnimationFrame(() => {
                        card.classList.add('card-visible');
                    });
                    cardObserver.unobserve(card);
                }
            });
        }, { threshold: 0.05, rootMargin: '0px 0px 80px 0px' });

        function createChapterCard(imgUrl, chapterIdx, photoIdxInChapter, labelPrefix) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.style.transitionDelay = `${(photoIdxInChapter % 6) * 40}ms`;
            card.innerHTML = `<img src="${imgUrl}" alt="${labelPrefix} ${photoIdxInChapter + 1}" loading="lazy" decoding="async">`;
            card.onclick = () => openFullscreen(chapterIdx, photoIdxInChapter);
            cardObserver.observe(card);
            return card;
        }

        // ৪. সব চ্যাপ্টার একত্রিত করা (১ম: সানি লিওন | ২য়: alyx star | ৩য়: মিয়াঁ খলিফা | ৪র্থ/শেষ: সেরা কিছু)
        function buildAllChaptersList() {
            const alyxChapter = moreChapters.find(ch => ch.name.trim().toLowerCase() === 'alyx star');
            const seraKichuChapter = moreChapters.find(ch => ch.name.trim() === 'সেরা কিছু');
            const otherCustomChapters = moreChapters.filter(
                ch => ch !== alyxChapter && ch !== seraKichuChapter
            );

            const list = [
                { name: 'সানি লিওন', links: imageLinks },
                alyxChapter || { name: 'alyx star', links: [] },
                { name: 'মিয়াঁ খলিফা', links: skskImageLinks },
                ...otherCustomChapters
            ];

            if (seraKichuChapter) {
                list.push(seraKichuChapter);
            }
            return list;
        }

        // টাইটেলের নিচে অটোমেটিক ALL এবং CH 1, CH 2, CH 3... বাটন তৈরি করা
        function renderFilterButtons() {
            const filterBar = document.getElementById('chapter-filter-bar');
            if (!filterBar) return;
            filterBar.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = `ch-filter-btn ${activeFilterChapterIdx === 'all' ? 'active' : ''}`;
            allBtn.textContent = 'ALL';
            allBtn.onclick = () => selectChapterFilter('all');
            filterBar.appendChild(allBtn);

            allChaptersList.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = `ch-filter-btn ${activeFilterChapterIdx === idx ? 'active' : ''}`;
                btn.textContent = `CH ${idx + 1}`;
                btn.title = ch.name;
                btn.onclick = () => selectChapterFilter(idx);
                filterBar.appendChild(btn);
            });
        }

        function selectChapterFilter(targetIdx) {
            if (activeFilterChapterIdx === targetIdx && targetIdx !== 'all') {
                activeFilterChapterIdx = 'all';
            } else {
                activeFilterChapterIdx = targetIdx;
            }
            renderFilterButtons();
            renderGalleryView();
        }

        function renderGalleryView() {
            const firstTitleWrap = document.getElementById('first-chapter-title-wrap');
            const firstTitleEl = document.getElementById('first-chapter-title');
            const secondTitleWrap = document.getElementById('second-chapter-title-wrap');

            gallery.innerHTML = '';
            gallerySksk.innerHTML = '';

            let extraContainer = document.getElementById('extra-chapters-container');
            if (!extraContainer) {
                extraContainer = document.createElement('div');
                extraContainer.id = 'extra-chapters-container';
                gallerySksk.insertAdjacentElement('afterend', extraContainer);
            }
            extraContainer.innerHTML = '';

            if (activeFilterChapterIdx === 'all') {
                if (firstTitleWrap) firstTitleWrap.style.display = 'block';
                if (firstTitleEl && allChaptersList[0]) {
                    firstTitleEl.textContent = allChaptersList[0].name;
                }
                if (allChaptersList[0]) {
                    allChaptersList[0].links.forEach((imgUrl, idx) => {
                        gallery.appendChild(createChapterCard(imgUrl, 0, idx, allChaptersList[0].name));
                    });
                }

                if (allChaptersList[1]) {
                    if (secondTitleWrap) secondTitleWrap.style.display = 'block';
                    if (secondChapterTitle) secondChapterTitle.textContent = allChaptersList[1].name;
                    gallerySksk.style.display = 'grid';
                    allChaptersList[1].links.forEach((imgUrl, idx) => {
                        gallerySksk.appendChild(createChapterCard(imgUrl, 1, idx, allChaptersList[1].name));
                    });
                } else {
                    if (secondTitleWrap) secondTitleWrap.style.display = 'none';
                    gallerySksk.style.display = 'none';
                }

                allChaptersList.slice(2).forEach((chapter, sliceIdx) => {
                    const realChapterIdx = sliceIdx + 2;
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'w-full max-w-6xl mx-auto px-6 pt-8 pb-2 text-left';
                    titleDiv.innerHTML = `<h2 class="text-white text-2xl font-light opacity-80">${chapter.name}</h2>`;
                    extraContainer.appendChild(titleDiv);

                    const sec = document.createElement('section');
                    sec.className = 'gallery-grid';

                    chapter.links.forEach((imgUrl, idx) => {
                        sec.appendChild(createChapterCard(imgUrl, realChapterIdx, idx, chapter.name));
                    });

                    extraContainer.appendChild(sec);
                });
            } else {
                const selectedChapter = allChaptersList[activeFilterChapterIdx];
                if (!selectedChapter) return;

                if (firstTitleWrap) firstTitleWrap.style.display = 'block';
                if (firstTitleEl) firstTitleEl.textContent = selectedChapter.name;
                if (secondTitleWrap) secondTitleWrap.style.display = 'none';
                gallerySksk.style.display = 'none';

                selectedChapter.links.forEach((imgUrl, idx) => {
                    gallery.appendChild(createChapterCard(imgUrl, activeFilterChapterIdx, idx, selectedChapter.name));
                });
            }
        }

        function initGallery() {
            allChaptersList = buildAllChaptersList();
            renderFilterButtons();
            renderGalleryView();
        }
// জুম ও প্যান ভেরিয়েবল (ফোনের পিঞ্চ-জুম এবং ল্যাপটপের মাউস হুইল জুমের জন্য)
        let panX = 0;
        let panY = 0;
        let isPinching = false;
        let isPanningZoomed = false;
        let pinchStartDist = 0;
        let pinchStartScale = 1;
        let panStartClientX = 0;
        let panStartClientY = 0;
        let panOriginX = 0;
        let panOriginY = 0;
        let pinchCooldownUntil = 0;

        function applyZoomTransform(withTransition = false) {
            fsImg.style.transition = withTransition ? 'transform 0.2s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
            fsImg.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
        }

        function resetZoomState(withTransition = false) {
            scale = 1;
            panX = 0;
            panY = 0;
            isPinching = false;
            isPanningZoomed = false;
            applyZoomTransform(withTransition);
        }

        function getTouchDistance(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.hypot(dx, dy);
        }

        // ৫. ফুলস্ক্রিন স্লাইডার সিঙ্ক ও ০-সেকেন্ড ইনস্ট্যান্ট লোডিং
        function syncSliderImages() {
            if (!images.length) return;
            const total = images.length;
            const prevIndex = (currentIdx - 1 + total) % total;
            const nextIndex = (currentIdx + 1 + total) % total;

            sliderTrack.style.transition = 'none';
            const vw = window.innerWidth;
            sliderTrack.style.transform = `translate3d(${-vw}px, 0, 0)`;

            resetZoomState(false);

            fsPrevImg.src = images[prevIndex];
            fsImg.src = images[currentIdx];
            fsNextImg.src = images[nextIndex];

            preloadNeighborImages();
        }

        // ৬. যে ছবিতে ক্লিক করবেন ঠিক সেই ছবিটাই ওপেন হবে:
        // - ALL সিলেক্ট থাকলে সব চ্যাপ্টারের সব ছবি ফুলস্ক্রিন ও Auto Play-তে ঘুরবে
        // - নির্দিষ্ট CH সিলেক্ট থাকলে শুধু ওই চ্যাপ্টারের ছবিগুলোই ঘুরবে
        function openFullscreen(chapterIdx, photoIdxInChapter) {
            if (activeFilterChapterIdx === 'all') {
                images = [];
                let targetGlobalIdx = 0;
                let count = 0;

                allChaptersList.forEach((ch, cIdx) => {
                    ch.links.forEach((link, pIdx) => {
                        if (cIdx === chapterIdx && pIdx === photoIdxInChapter) {
                            targetGlobalIdx = count;
                        }
                        images.push(link);
                        count++;
                    });
                });
                currentIdx = targetGlobalIdx;
            } else {
                const targetChapter = allChaptersList[chapterIdx];
                if (!targetChapter || !targetChapter.links.length) return;
                images = [...targetChapter.links];
                currentIdx = photoIdxInChapter;
            }

            isAnimatingSlide = false;
            isDragging = false;
            clearTimeout(slideReleaseTimer);

            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
            syncSliderImages();
        }

        function closeFullscreen() {
            overlay.style.display = 'none';
            stopAutoPlay();
            isAnimatingSlide = false;
            isDragging = false;
            resetZoomState(false);
            clearTimeout(slideReleaseTimer);
            document.body.style.overflow = 'auto';
        }

        fsImg.addEventListener('dblclick', () => {
            if (scale > 1.05) {
                resetZoomState(true);
            } else {
                closeFullscreen();
            }
        });

        // ৭. ল্যাগ-মুক্ত ১টি করে ছবি স্লাইড হওয়ার ফাংশন (একবারে কখনোই ২-৩টা লাফাবে না)
        function slideToDirection(direction) {
            if (isAnimatingSlide || !images.length) return;
            isAnimatingSlide = true;
            clearTimeout(slideReleaseTimer);

            if (scale !== 1 || panX !== 0 || panY !== 0) {
                resetZoomState(true);
            }

            const vw = window.innerWidth;
            sliderTrack.style.transition = 'transform 0.26s cubic-bezier(0.22, 1, 0.36, 1)';
            if (direction === 'next') {
                sliderTrack.style.transform = `translate3d(${-2 * vw}px, 0, 0)`;
            } else {
                sliderTrack.style.transform = `translate3d(0px, 0, 0)`;
            }

            slideReleaseTimer = setTimeout(() => {
                const total = images.length;
                if (direction === 'next') {
                    currentIdx = (currentIdx + 1) % total;
                } else {
                    currentIdx = (currentIdx - 1 + total) % total;
                }
                syncSliderImages();
                isAnimatingSlide = false;
            }, 265);
        }

        function nextImg() {
            slideToDirection('next');
        }

        function prevImg() {
            slideToDirection('prev');
        }

        // ল্যাপটপ/ডেস্কটপের দুই পাশের মোটা অ্যারো বাটনে মাউস দিয়ে ক্লিক করলে কাজ করা
        if (fsDesktopPrev) {
            fsDesktopPrev.onclick = (e) => {
                e.stopPropagation();
                prevImg();
            };
        }
        if (fsDesktopNext) {
            fsDesktopNext.onclick = (e) => {
                e.stopPropagation();
                nextImg();
            };
        }

        // ৮. ফোনে ২ আঙুল দিয়ে জুম-ইন/জুম-আউট (Pinch Zoom) এবং ১ আঙুল দিয়ে মাখনের মতো স্মুথ সোয়াইপ
        overlay.addEventListener('touchstart', e => {
            if (e.target.closest('.controls') || e.target.closest('.desktop-nav-arrow')) return;
            if (isAnimatingSlide) return;

            // ২ আঙুল দিলে সাথে সাথে সোয়াইপ বন্ধ হয়ে পিঞ্চ-জুম চালু হবে
            if (e.touches.length === 2) {
                isDragging = false;
                isPanningZoomed = false;
                isPinching = true;
                const vw = window.innerWidth;
                sliderTrack.style.transition = 'none';
                sliderTrack.style.transform = `translate3d(${-vw}px, 0, 0)`;
                pinchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
                pinchStartScale = scale;
                return;
            }

            // ১ আঙুল দিলে: যদি জুম করা থাকে তবে ছবি চারপাশে সরানো (Pan) যাবে, আর জুম না থাকলে পাশের ছবিতে সোয়াইপ হবে
            if (e.touches.length === 1) {
                if (Date.now() < pinchCooldownUntil) return;

                if (scale > 1.02) {
                    isDragging = false;
                    isPanningZoomed = true;
                    panStartClientX = e.touches[0].clientX;
                    panStartClientY = e.touches[0].clientY;
                    panOriginX = panX;
                    panOriginY = panY;
                } else {
                    startX = e.touches[0].clientX;
                    currentDragX = 0;
                    isDragging = true;
                    sliderTrack.style.transition = 'none';
                }
            }
        }, { passive: true });

        overlay.addEventListener('touchmove', e => {
            if (isAnimatingSlide) return;

            // ২ আঙুলে টেনে জুম-ইন এবং জুম-আউট করা
            if (isPinching && e.touches.length === 2) {
                const dist = getTouchDistance(e.touches[0], e.touches[1]);
                if (pinchStartDist > 0) {
                    const newScale = pinchStartScale * (dist / pinchStartDist);
                    scale = Math.min(Math.max(1, newScale), 4);
                    if (scale <= 1.02) {
                        panX = 0;
                        panY = 0;
                    }
                    applyZoomTransform(false);
                }
                return;
            }

            // জুম করা অবস্থায় ১ আঙুল দিয়ে ছবি সরিয়ে দেখা
            if (isPanningZoomed && e.touches.length === 1 && scale > 1.02) {
                const dx = e.touches[0].clientX - panStartClientX;
                const dy = e.touches[0].clientY - panStartClientY;
                const maxPanX = (window.innerWidth * (scale - 1)) * 0.5;
                const maxPanY = (window.innerHeight * (scale - 1)) * 0.5;
                panX = Math.max(-maxPanX, Math.min(maxPanX, panOriginX + dx));
                panY = Math.max(-maxPanY, Math.min(maxPanY, panOriginY + dy));
                applyZoomTransform(false);
                return;
            }

            // স্বাভাবিক অবস্থায় (`scale === 1`) ১ আঙুল দিয়ে টেনে পাশের ছবিতে সোয়াইপ করা
            if (isDragging && e.touches.length === 1 && scale <= 1.02) {
                const vw = window.innerWidth;
                const rawDelta = e.touches[0].clientX - startX;
                currentDragX = Math.max(-vw * 0.95, Math.min(vw * 0.95, rawDelta));
                sliderTrack.style.transform = `translate3d(${-vw + currentDragX}px, 0, 0)`;
            }
        }, { passive: true });

        overlay.addEventListener('touchend', e => {
            // পিঞ্চ-জুম শেষ হলে
            if (isPinching) {
                if (e.touches.length < 2) {
                    isPinching = false;
                    pinchCooldownUntil = Date.now() + 180; // জুম ছাড়ার সাথে সাথে যেন ভুল করে স্লাইড না হয়ে যায়
                    if (scale < 1.06) {
                        resetZoomState(true);
                    }
                }
                return;
            }

            // জুম প্যান শেষ হলে
            if (isPanningZoomed) {
                if (e.touches.length === 0) {
                    isPanningZoomed = false;
                }
                return;
            }

            // ১ আঙুলের সোয়াইপ শেষ হলে পরের বা আগের ছবিতে যাওয়া
            if (!isDragging) return;
            isDragging = false;

            if (scale > 1.02 || isAnimatingSlide) return;

            const vw = window.innerWidth;
            const swipeThreshold = vw * 0.14;
            if (currentDragX < -swipeThreshold) {
                slideToDirection('next');
            } else if (currentDragX > swipeThreshold) {
                slideToDirection('prev');
            } else {
                sliderTrack.style.transition = 'transform 0.2s cubic-bezier(0.22, 1, 0.36, 1)';
                sliderTrack.style.transform = `translate3d(${-vw}px, 0, 0)`;
            }
            currentDragX = 0;
        });

        // স্ক্রিন রিসাইজ হলে স্লাইডার ঠিক রাখা
        window.addEventListener('resize', () => {
            if (overlay.style.display === 'block' && !isAnimatingSlide) {
                const vw = window.innerWidth;
                sliderTrack.style.transition = 'none';
                sliderTrack.style.transform = `translate3d(${-vw}px, 0, 0)`;
            }
        });

        // ৯. ল্যাপটপের কিবোর্ডের ডান (ArrowRight) ও বাম (ArrowLeft) বাটনে চাপ দিয়ে ১টি করে ছবি পরিবর্তন
        window.addEventListener('keydown', e => {
            if (overlay.style.display === 'block') {
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextImg();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevImg();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeFullscreen();
                }
            }
        });

        // ১০. ল্যাপটপ/ডেস্কটপে মাউসের চাকা (Wheel) ঘুরিয়ে জুম-ইন ও জুম-আউট
        overlay.addEventListener('wheel', e => {
            e.preventDefault();
            scale += e.deltaY * -0.0012;
            scale = Math.min(Math.max(1, scale), 4);
            if (scale <= 1.02) {
                panX = 0;
                panY = 0;
            }
            applyZoomTransform(true);
        }, { passive: false });

        function toggleAutoPlay() {
            if (isAutoPlaying) stopAutoPlay();
            else startAutoPlay();
        }

        function startAutoPlay() {
            stopAutoPlay();
            isAutoPlaying = true;
            autoPlayBtn.innerText = "Auto Play: ON";
            autoPlayInterval = setInterval(() => {
                if (!isDragging && !isAnimatingSlide) {
                    nextImg();
                }
            }, 3000);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            autoPlayBtn.innerText = "Auto Play: OFF";
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        autoPlayBtn.onclick = (e) => {
            e.stopPropagation();
            toggleAutoPlay();
        };

        overlay.onclick = (e) => {
            if (e.target === overlay || e.target.classList.contains('fs-slide') || e.target === fsImg) {
                if (isAutoPlaying) stopAutoPlay();
            }
        };

        // বাটার-স্মুথ স্ক্রল শ্রোতা (passive listener)
        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                scrollTop.style.display = "flex";
            } else {
                scrollTop.style.display = "none";
            }
        }, { passive: true });

        // গ্যালারি পিন দেওয়ার পর আনলক হলেই চালু হবে
        document.body.style.overflow = 'hidden';
    </script>
</body>
</html>
